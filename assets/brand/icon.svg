<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18b4ee"/>
      <stop offset="1" stop-color="#1e48c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#glow)"/>

  <g transform="translate(-14 -6)">
  <!-- house -->
  <path d="M62 118 V190 a14 14 0 0 0 14 14 H162 a14 14 0 0 0 14 -14 V118" fill="#ffffff" fill-opacity="0.14"
