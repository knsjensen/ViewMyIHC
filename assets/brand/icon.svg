  <path d="M40 126 L119 54 L198 126" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- project tree inside the house -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M119 118 V138 M119 138 H94 V158 M119 138 H144 V158"/>
  </g>
  <circle cx="119" cy="112" r="11" fill="#ffffff"/>
  <circle cx="94" cy="166" r="10" fill="#ffffff"/>
  <circle cx="144" cy="166" r="10" fill="#ffffff"/>
  </g>

  <!-- magnifier: "view" -->
  <circle cx="184" cy="176" r="31" fill="url(#lens)"/>
  <circle cx="184" cy="176" r="31" fill="none" stroke="#ffc933" stroke-width="12"/>
  <path d="M207 199 L229 221" stroke="#ffc933" stroke-width="14" stroke-linecap="round"/>
  <path d="M166 166 a20 20 0 0 1 13 -10" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>
