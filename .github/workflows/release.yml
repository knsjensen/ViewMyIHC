name: Release

# Two ways to publish a version:
#  - run this workflow by hand with the version (e.g. 0.12.0): it tags, creates the GitHub release and attaches the zip;
#  - or publish a release in GitHub's web interface with the tag v<version>: this attaches the zip to it.
# HACS installs the attached viewmyihc.zip (see hacs.json) and offers the update to its users.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v (must equal manifest.json)"
        required: true
      prerelease:
        description: "Mark as pre-release (HACS only offers it to users who ask for beta versions)"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then version="${INPUT_VERSION#v}"; else version="${TAG#v}"; fi
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/viewmyihc/manifest.json'))['version'])")
          if [ "$version" != "$manifest" ]; then
            echo "::error::Version $version does not match manifest.json ($manifest). Bump the version first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build viewmyihc.zip
        run: |
          cd custom_components/viewmyihc
          zip -r ../../viewmyihc.zip . -x "__pycache__/*" "*.pyc"
          cd ../..
          unzip -l viewmyihc.zip

      - name: Create the release (run by hand)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "v$VERSION" viewmyihc.zip --title "v$VERSION" --generate-notes --target "$GITHUB_SHA" $flags

      - name: Attach the zip (release published on GitHub)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" viewmyihc.zip --clobber
